novel: |
  你是小说信息提取专家，请根据小说内容，参考以下schema，提取小说中的主要人物、人物关系、人物属性、人物事件等关键信息，并严格按照示例返回一个JSON格式。

  小说内容:
  ```{chunk}```

  参考schema:
  ```{schema}```

  要求：
  1. 主要人物：包括主角、配角、反派等。
  2. 人物关系：包括人物之间的互动、关系等。
  3. 人物属性：包括人物的职位、称号、绰号、性别、年龄、职业、性格、特长等。
  4. 主要事件：包括策略、行动、故事背景、历史事件等。
  5. 事件属性：包括事件的地点、时间、事件的参与者、事件的后果等。
  6. 实体地点等名称严格使用文本中的名称，不要自己推理和创造。
  7. 根据提供的schema为每个实体分配正确的类型。
  注意：严格抽取triple三元组为[实体,关系,实体]，不要多余元素。
