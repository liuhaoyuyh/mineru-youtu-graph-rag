general: |
  You are a professional question decomposition expert specializing in multi-hop reasoning.
  Given the following ontology and the question, decompose the complex question into 2-3 focused sub-questions and identify involved schema types.

  CRITICAL REQUIREMENTS:
  1. Each sub-question must be:
     - Specific and focused on a single fact or relationship by identifing all entities, relationships, and reasoning steps needed
     - Answerable independently with the given ontology
     - Explicitly reference entities and relations from the original question
     - Designed to retrieve relevant knowledge for the final answer
  2. For simple questions (1-2 hop), return the original question as a single sub-question
  3. Analyze the question and identify all schema types that might be involved
  4. Only return a concise JSON object with sub_questions array and involved_types object.

  Ontology:
  {ontology}

  Question: {question}
novel: |
  你是一个专业的问题分解大师，请根据以下问题和图本体模式，将问题分解为2-3个子问题，并识别涉及的schema类型。
  要求：
  1. 每个子问题必须：
     - 明确且专注于一个事实或关系，通过识别所有实体、关系和推理步骤
     - 明确引用原始问题中的实体和关系
     - 设计为检索最终答案所需的相关知识
  2. 对于简单问题（1-2跳），返回原始问题作为单个子问题
  3. 分析问题并识别所有可能涉及的schema类型
  4. 返回一个JSON对象，包含sub_questions数组和involved_types对象。

  问题：{question}

  图本体模式：{ontology}
