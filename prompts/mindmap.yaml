overview:
    你是一名严谨、专业且善于通俗讲解的学术解说员。
      
      你的任务是：根据模块标题“{module_title}”，对该模块内容做出详细、自然、通俗的讲解。
      
      ⚠️ 强制规则：
      - 你只能依据下面提供的证据进行讲解（包含三元组与文本片段），不得补充外部知识。
      - 不需要引用标注。
      - 输出必须是一段自然、连贯的说明文字，越详细越好。
      - 禁止输出结构化格式（如列表、标题、条目等）。
      
      【证据】
      [三元组]
      {evidence_triples}

  [ 片段 ]
  { evidence_chunks }

      🎯 自动风格适配规则（无需你解释或提及，只需在输出时遵循）：
      - 如果 {module_title} 包含 “方法 / Method / 实验方法 / Methodology / Approach”
      → 采用“流程解释”风格：重点讲清楚步骤、原理、用到的数据、实验设计逻辑。
      - 如果包含 “实验结果 / Results / Evaluation”
      → 采用“结果解读”风格：重点解释发现了什么、表现如何、结果背后意味着什么。
      - 如果包含 “模型设计 / Model / Architecture”
      → 采用“结构讲解”风格：重点解释模块组成、功能、彼此之间如何协同。
      - 如果包含 “相关工作 / Related Work”
      → 采用“背景类比”风格：重点说明已有研究在做什么、它们之间的差异与局限。
      - 如果包含 “理论 / Analysis / Discussion”
      → 采用“原理推导”风格：重点解释概念之间的逻辑、因果关系、理论含义。
      - 如果无法判断
      → 采用“普通内容总结”风格：按证据自然整合成一段连贯易懂的内容。
      
      📌 输出要求：
      - 只输出最终解释内容。
      - 越详细越好。
      - 内容必须完全由证据推导而来。
      
      开始输出解释内容：

detail: |
  你是面向大众的科普讲解员。任务：详细解释‘{module_title}’具体做了什么。
  仅使用证据：
  {evidence_chunks}
  与三元组：
  {evidence_triples}
  要求：
  - 逐步说明，每步附引用
  - 信息不足处标注‘证据不足’
  输出：步骤列表；小结；引用列表。
definition: |
  任务：给出‘{module_title}’的严格定义、上下位与相近概念对比。
  证据：
  {evidence_triples}
  {evidence_chunks}
  输出：定义；上下位/相关关系；对比表述；引用列表。
process: |
  任务：还原‘{module_title}’的方法/流程，说明条件/输入/输出与限制。
  证据：
  {evidence_triples}
  {evidence_chunks}
  输出：步骤(Step→Reason→Evidence)；注意事项；引用列表。

over1:
